AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Secure serverless data pipeline - S3 data lake, Lambda ingestion, Glue ETL + Data Catalog,
  Athena analytics, least-privilege IAM, alerting.

Parameters:
  ProjectName:
    Type: String
    Default: salesdl
    AllowedPattern: "^[a-z][a-z0-9-]{2,19}$"
  DataBucketName:
    Type: String
    Description: Globally unique name for the data lake bucket (deploy.sh sets this).
  ArtifactBucketName:
    Type: String
    Description: Bucket that holds the Glue script (deploy.sh sets this).
  GlueScriptKey:
    Type: String
    Default: glue/etl_job.py
  AlertEmail:
    Type: String
    Default: ""
    Description: Optional e-mail for failure alerts.

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]

Resources:
  # ------------------------------------------------------------------ S3
  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    DependsOn: S3InvokeLambdaPermission
    Properties:
      BucketName: !Ref DataBucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - Id: expire-athena-results
            Status: Enabled
            Prefix: athena-results/
            ExpirationInDays: 7
          - Id: expire-quarantine
            Status: Enabled
            Prefix: quarantine/
            ExpirationInDays: 90
          - Id: archive-raw
            Status: Enabled
            Prefix: raw/
            Transitions:
              - { StorageClass: STANDARD_IA, TransitionInDays: 30 }
            NoncurrentVersionExpiration: { NoncurrentDays: 30 }
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: "s3:ObjectCreated:*"
            Function: !GetAtt IngestFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - { Name: prefix, Value: raw/ }
                  - { Name: suffix, Value: .csv }

  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !Sub "arn:aws:s3:::${DataBucketName}"
              - !Sub "arn:aws:s3:::${DataBucketName}/*"
            Condition:
              Bool: { "aws:SecureTransport": "false" }

  # --------------------------------------------------------- Lambda + IAM
  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-ingest-dlq"
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600

  IngestFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: "sts:AssumeRole"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ingest-least-privilege
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadAndRemoveRaw
                Effect: Allow
                Action: ["s3:GetObject", "s3:DeleteObject"]
                Resource: !Sub "arn:aws:s3:::${DataBucketName}/raw/*"
              - Sid: WriteQuarantine
                Effect: Allow
                Action: ["s3:PutObject"]
                Resource: !Sub "arn:aws:s3:::${DataBucketName}/quarantine/*"
              - Sid: StartOnlyThisGlueJob
                Effect: Allow
                Action: ["glue:StartJobRun"]
                Resource: !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:job/${ProjectName}-etl-job"
              - Sid: SendFailuresToDLQ
                Effect: Allow
                Action: ["sqs:SendMessage"]
                Resource: !GetAtt DeadLetterQueue.Arn

  IngestFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-ingest"
      Runtime: python3.12
      Handler: handler.lambda_handler
      Code: ../lambda
      Role: !GetAtt IngestFunctionRole.Arn
      Timeout: 60
      MemorySize: 256
      DeadLetterConfig:
        TargetArn: !GetAtt DeadLetterQueue.Arn
      Environment:
        Variables:
          GLUE_JOB_NAME: !Sub "${ProjectName}-etl-job"
          REQUIRED_COLUMNS: "order_id,customer_id,product,quantity,unit_price,status,order_date,updated_at"

  IngestFunctionRetries:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref IngestFunction
      Qualifier: $LATEST
      MaximumRetryAttempts: 2
      MaximumEventAgeInSeconds: 3600

  S3InvokeLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref IngestFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:aws:s3:::${DataBucketName}"

  # ----------------------------------------------------------------- Glue
  GlueRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: glue.amazonaws.com }
            Action: "sts:AssumeRole"
      Policies:
        - PolicyName: glue-least-privilege
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadRawAndScript
                Effect: Allow
                Action: ["s3:GetObject"]
                Resource:
                  - !Sub "arn:aws:s3:::${DataBucketName}/raw/*"
                  - !Sub "arn:aws:s3:::${ArtifactBucketName}/${GlueScriptKey}"
              - Sid: WriteProcessedAndQuarantine
                Effect: Allow
                Action: ["s3:PutObject", "s3:GetObject", "s3:DeleteObject"]
                Resource:
                  - !Sub "arn:aws:s3:::${DataBucketName}/processed/*"
                  - !Sub "arn:aws:s3:::${DataBucketName}/quarantine/*"
                  - !Sub "arn:aws:s3:::${DataBucketName}/tmp/*"
              - Sid: ListBucket
                Effect: Allow
                Action: ["s3:ListBucket", "s3:GetBucketLocation"]
                Resource: !Sub "arn:aws:s3:::${DataBucketName}"
              - Sid: CatalogAccess
                Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:GetTable
                  - glue:GetTables
                  - glue:CreateTable
                  - glue:UpdateTable
                  - glue:GetPartition
                  - glue:GetPartitions
                  - glue:CreatePartition
                  - glue:BatchCreatePartition
                  - glue:UpdatePartition
                  - glue:BatchGetPartition
                Resource:
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog"
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/${ProjectName}_db"
                  - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/${ProjectName}_db/*"
              - Sid: StartCrawler
                Effect: Allow
                Action: ["glue:StartCrawler", "glue:GetCrawler"]
                Resource: !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:crawler/${ProjectName}-processed-crawler"
              - Sid: Logs
                Effect: Allow
                Action: ["logs:CreateLogGroup", "logs:CreateLogStream", "logs:PutLogEvents"]
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws-glue/*"

  GlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Sub "${ProjectName}_db"
        Description: Sales data lake catalog

  GlueJob:
    Type: AWS::Glue::Job
    Properties:
      Name: !Sub "${ProjectName}-etl-job"
      Role: !GetAtt GlueRole.Arn
      GlueVersion: "4.0"
      WorkerType: G.1X
      NumberOfWorkers: 2
      Timeout: 30
      MaxRetries: 1
      ExecutionProperty: { MaxConcurrentRuns: 5 }
      Command:
        Name: glueetl
        PythonVersion: "3"
        ScriptLocation: !Sub "s3://${ArtifactBucketName}/${GlueScriptKey}"
      DefaultArguments:
        "--job-language": python
        "--TempDir": !Sub "s3://${DataBucketName}/tmp/"
        "--TARGET_PATH": !Sub "s3://${DataBucketName}/processed/sales/"
        "--QUARANTINE_PATH": !Sub "s3://${DataBucketName}/quarantine/rejected_rows/"
        "--CRAWLER_NAME": !Sub "${ProjectName}-processed-crawler"
        "--enable-metrics": "true"
        "--enable-continuous-cloudwatch-log": "true"

  GlueCrawler:
    Type: AWS::Glue::Crawler
    Properties:
      Name: !Sub "${ProjectName}-processed-crawler"
      Role: !GetAtt GlueRole.Arn
      DatabaseName: !Ref GlueDatabase
      Targets:
        S3Targets:
          - Path: !Sub "s3://${DataBucketName}/processed/sales/"
      SchemaChangePolicy:
        UpdateBehavior: UPDATE_IN_DATABASE
        DeleteBehavior: LOG
      Configuration: '{"Version":1.0,"Grouping":{"TableGroupingPolicy":"CombineCompatibleSchemas"}}'

  # --------------------------------------------------------------- Athena
  AthenaWorkGroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: !Sub "${ProjectName}-wg"
      State: ENABLED
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        PublishCloudWatchMetricsEnabled: true
        BytesScannedCutoffPerQuery: 1073741824
        ResultConfiguration:
          OutputLocation: !Sub "s3://${DataBucketName}/athena-results/"
          EncryptionConfiguration: { EncryptionOption: SSE_S3 }
        EngineVersion: { SelectedEngineVersion: "Athena engine version 3" }

  QueryDailyRevenue:
    Type: AWS::Athena::NamedQuery
    Properties:
      Name: daily-revenue
      Database: !Sub "${ProjectName}_db"
      WorkGroup: !Ref AthenaWorkGroup
      QueryString: |
        WITH latest AS (
          SELECT *, ROW_NUMBER() OVER (PARTITION BY order_id ORDER BY updated_at DESC) AS rn
          FROM sales)
        SELECT order_date, COUNT(*) AS orders, SUM(quantity) AS units, ROUND(SUM(revenue), 2) AS revenue
        FROM latest WHERE rn = 1 AND status <> 'CANCELLED'
        GROUP BY order_date ORDER BY order_date;

  QueryTopProducts:
    Type: AWS::Athena::NamedQuery
    Properties:
      Name: top-products
      Database: !Sub "${ProjectName}_db"
      WorkGroup: !Ref AthenaWorkGroup
      QueryString: |
        WITH latest AS (
          SELECT *, ROW_NUMBER() OVER (PARTITION BY order_id ORDER BY updated_at DESC) AS rn
          FROM sales)
        SELECT product, SUM(quantity) AS units, ROUND(SUM(revenue), 2) AS revenue
        FROM latest WHERE rn = 1 AND status <> 'CANCELLED'
        GROUP BY product ORDER BY revenue DESC;

  QueryLoadAudit:
    Type: AWS::Athena::NamedQuery
    Properties:
      Name: rows-per-batch-audit
      Database: !Sub "${ProjectName}_db"
      WorkGroup: !Ref AthenaWorkGroup
      QueryString: |
        SELECT ingest_date, batch_id, COUNT(*) AS rows_loaded
        FROM sales GROUP BY ingest_date, batch_id ORDER BY ingest_date DESC;

  # ------------------------------------------------- Analyst access (IAM)
  AnalystPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Read-only analytics on processed data via the Athena workgroup. No access to raw or quarantine.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: RunAthenaQueries
            Effect: Allow
            Action:
              - athena:StartQueryExecution
              - athena:StopQueryExecution
              - athena:GetQueryExecution
              - athena:GetQueryResults
              - athena:GetWorkGroup
              - athena:GetNamedQuery
              - athena:ListNamedQueries
              - athena:BatchGetNamedQuery
            Resource: !Sub "arn:aws:athena:${AWS::Region}:${AWS::AccountId}:workgroup/${AthenaWorkGroup}"
          - Sid: ReadCatalog
            Effect: Allow
            Action: [glue:GetDatabase, glue:GetTable, glue:GetTables, glue:GetPartition, glue:GetPartitions, glue:BatchGetPartition]
            Resource:
              - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog"
              - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/${ProjectName}_db"
              - !Sub "arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/${ProjectName}_db/*"
          - Sid: ReadProcessedData
            Effect: Allow
            Action: ["s3:GetObject"]
            Resource: !Sub "arn:aws:s3:::${DataBucketName}/processed/*"
          - Sid: AthenaResults
            Effect: Allow
            Action: ["s3:GetObject", "s3:PutObject", "s3:AbortMultipartUpload"]
            Resource: !Sub "arn:aws:s3:::${DataBucketName}/athena-results/*"
          - Sid: ListBucketPrefixes
            Effect: Allow
            Action: ["s3:ListBucket", "s3:GetBucketLocation"]
            Resource: !Sub "arn:aws:s3:::${DataBucketName}"
            Condition:
              StringLike: { "s3:prefix": ["processed/*", "athena-results/*", ""] }

  # ------------------------------------------------------------ Alerting
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${ProjectName}-alerts"
      KmsMasterKeyId: alias/aws/sns

  AlertSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  LambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-ingest-errors"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref IngestFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  GlueFailureRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Notify when the Glue ETL job fails or times out
      EventPattern:
        source: [aws.glue]
        detail-type: ["Glue Job State Change"]
        detail:
          jobName: [!Sub "${ProjectName}-etl-job"]
          state: [FAILED, TIMEOUT, ERROR]
      Targets:
        - Id: sns
          Arn: !Ref AlertTopic

  AlertTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref AlertTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: [events.amazonaws.com, cloudwatch.amazonaws.com] }
            Action: "sns:Publish"
            Resource: !Ref AlertTopic

Outputs:
  DataBucket: { Value: !Ref DataBucketName }
  AthenaWorkGroup: { Value: !Ref AthenaWorkGroup }
  GlueDatabase: { Value: !Ref GlueDatabase }
  GlueJob: { Value: !Ref GlueJob }
  AnalystPolicyArn: { Value: !Ref AnalystPolicy }
